name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/polycule_client/flutter-dockerimages:3.41.2-android
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      CP_HOME_DIR: ${{ github.workspace }}/.pod-cache
      KEY_BASE64: ${{ secrets.KEY_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS || secrets.KEY_ALIAS }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and validate signing key
        shell: bash
        run: |
          if [[ -z "$KEY_BASE64" ]]; then
            echo "KEY_BASE64 is required to sign the APK" >&2
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEY_BASE64" | base64 --decode > android/app/keystore.jks
          test -s android/app/keystore.jks
          keytool -list \
            -keystore android/app/keystore.jks \
            -storepass "${KEYSTORE_PASSWORD:-password}" \
            -alias "${KEY_ALIAS:-alias_name}" > /dev/null

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve Flutter dependencies
        run: flutter pub get 

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run Flutter tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if ((test_status != 0)); then
            # Public workflow pages hide raw logs from signed-out API clients.
            # Preserve the useful tail in a check annotation so a failed
            # feature-branch validation can still be diagnosed over SSH-only
            # GitHub access.
            # Check annotations are capped at roughly 8 KiB. Keep the actual
            # failure tail instead of letting dependency notices consume it.
            details=$(tail -n 100 flutter-test.log | tail -c 7000)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Flutter test diagnostics::$details"
            exit "$test_status"
          fi

      - name: Build ARM64 APK
        shell: bash
        run: |
          export POLYCULE_VERSION="v0.4.0"
          # The last GitLab ARM64 APK has versionCode 268295502. The ABI
          # suffix is added by Gradle, so its Flutter build number was
          # 26829550. GitHub run 3 is therefore the first continuation and
          # must produce ARM64 versionCode 268295512.
          LAST_GITLAB_BUILD_NUMBER=26829550
          LAST_GITHUB_RUN_BEFORE_MIGRATION=2
          BUILD_NUMBER=$((
            LAST_GITLAB_BUILD_NUMBER
            + GITHUB_RUN_NUMBER
            - LAST_GITHUB_RUN_BEFORE_MIGRATION
          ))
          ARM64_VERSION_CODE=$((BUILD_NUMBER * 10 + 2))
          if ((ARM64_VERSION_CODE <= 268295502)); then
            echo "Android versionCode does not follow the last GitLab APK: $ARM64_VERSION_CODE" >&2
            exit 1
          fi
          if ((ARM64_VERSION_CODE > 2100000000)); then
            echo "Android build number range exhausted: $BUILD_NUMBER" >&2
            exit 1
          fi
          echo "Building ARM64 APK with versionCode $ARM64_VERSION_CODE"
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-number "$BUILD_NUMBER" \
            --dart-define=POLYCULE_IS_STABLE=true \
            --dart-define=POLYCULE_VERSION="$POLYCULE_VERSION" \
            --dart-define=no_default_http_client=true \
            --dart-define=cronetHttpNoPlay=true

      - name: Align, sign and verify APK
        shell: bash
        run: |
          KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-password}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          KEY_ALIAS="${KEY_ALIAS:-alias_name}"
          zipalign -p -f 4 \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            polycule-arm64-v8a-release-aligned.apk
          apksigner sign \
            --ks android/app/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            polycule-arm64-v8a-release-aligned.apk
          apksigner verify --verbose --print-certs \
            polycule-arm64-v8a-release-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: polycule-${{ github.sha }}
          path: polycule-arm64-v8a-release-aligned.apk
          if-no-files-found: error
          retention-days: 30
